apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "fullstack-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: backend
    release: {{ .Release.Name }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
