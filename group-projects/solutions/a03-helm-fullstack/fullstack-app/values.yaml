# Group path prefix — change per install (/g1, /g2, /g3)
pathPrefix: /g0

frontend:
  image: nginx:1.25
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

backend:
  image: stefanprodan/podinfo
  tag: "6.5.0"
  replicas: 2
  port: 9898
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  className: nginx
